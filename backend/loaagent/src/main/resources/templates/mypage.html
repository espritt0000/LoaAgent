<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoaAgent - 마이페이지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

<!-- 상단 내비게이션 바 -->
<div th:replace="~{fragments.html::navbar}"></div>

<!-- 메인 콘텐츠 영역 -->
<main class="max-w-xl mx-auto px-6 py-16 flex-grow flex flex-col justify-center w-full">
    <!-- 마이페이지 카드 -->
    <div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <!-- 헤더 섹션 -->
        <div class="mb-6 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-extrabold tracking-tight">마이페이지</h1>
            <p class="text-slate-400 text-sm mt-1">계정 정보 및 세션 상태를 확인할 수 있습니다.</p>
        </div>

        <!-- 바디 정보 섹션 -->
        <div class="space-y-4 mb-8">
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">로그인 아이디</span>
                <!-- DTO의 username 출력 -->
                <p class="text-base font-medium text-slate-200 mt-1" th:text="${loginMemberDto.username}">사용자</p>
            </div>

            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">권한 (Role)</span>
                <!-- DTO의 role 출력 -->
                <p class="text-base font-medium text-slate-200 mt-1" th:text="${loginMemberDto.role}">권한 없음</p>
            </div>

            <!-- 안내 박스 -->
            <div class="p-4 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm">
                현재 세션이 정상적으로 유지되고 있으며, 일정 시간 활동이 없으면 보안을 위해 자동으로 로그아웃됩니다.
            </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div class="flex justify-end gap-3">
            <a href="/" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold transition border border-slate-700 text-sm">
                메인으로 돌아가기
            </a>
        </div>
    </div>
</main>

<!-- footer -->
<div th:replace="~{fragments.html::footer}"></div>

</body>
</html>
