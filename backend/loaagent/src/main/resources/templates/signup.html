<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - LoaAgent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

<!-- 상단 내비게이션 -->
<div th:replace="~{fragments.html::navbar}"></div>

<!-- 회원가입 메인 영역 -->
<main class="max-w-md mx-auto px-6 py-16 flex-grow flex items-center w-full">
    <div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-8 w-full shadow-xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold mb-2">계정 만들기</h1>
            <p class="text-slate-400 text-sm">LoaAgent와 함께 스마트한 여정을 시작하세요.</p>
        </div>

        <form th:action="@{/signup}" th:object="${memberFormDto}" method="POST" class="space-y-5">
            <div th:if="${param.error}" class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center">
                이미 사용 중인 아이디입니다.
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">아이디</label>
                <input type="text" th:field="*{username}" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="영문·숫자 4~20자">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-xs text-red-400"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">이메일</label>
                <input type="email" th:field="*{email}" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="example@email.com">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-400"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">비밀번호</label>
                <!-- 비밀번호는 다시 채워 넣지 않도록 th:field 대신 name만 사용 -->
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="영문·숫자·특수문자 8~64자">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-400"></p>
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold transition shadow-lg shadow-blue-500/20">
                회원가입 완료
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            이미 계정이 있으신가요? <a href="/login" class="text-blue-400 hover:underline font-medium">로그인</a>
        </div>
    </div>
</main>

<!-- footer -->
<div th:replace="~{fragments.html::footer}"></div>

</body>
</html>
