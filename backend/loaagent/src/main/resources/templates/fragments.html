<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoaAgent - 로스트아크 AI 어시스턴트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

<!-- 상단 내비게이션 바 -->
<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50" th:fragment="navbar">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center space-x-3 hover:opacity-90 transition">
            <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">LoaAgent</span>
            <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">v1.0</span>
        </a>
        <nav class="flex items-center space-x-4">
            <!-- 1. 로그인 전 (익명 사용자): 로그인 / 회원가입 버튼 -->
            <a href="/login" sec:authorize="isAnonymous()" class="text-sm px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition font-medium">로그인</a>
            <a href="/signup" sec:authorize="isAnonymous()" class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition font-medium">회원가입</a>

            <a href="/mypage" sec:authorize="isAuthenticated()" class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition font-medium">MyPage</a>
            <!-- 2. 로그인 후 (인증된 사용자): 높이가 딱 맞아떨어지는 로그아웃 버튼 -->
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="m-0 p-0 inline-flex items-center">
                <button type="submit" class="text-sm px-4 py-2 rounded-lg bg-rose-600/80 hover:bg-rose-600 transition font-medium text-white cursor-pointer">
                    로그아웃
                </button>
            </form>

        </nav>
    </div>
</header>

<!-- footer -->
<footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm" th:fragment="footer">
    <p>&copy; 2026 LoaAgent Portfolio Project. All rights reserved.</p>
</footer>

</body>
</html>
