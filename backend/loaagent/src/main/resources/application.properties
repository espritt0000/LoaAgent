# 비밀 값(DB 비밀번호, keystore 비밀번호)은 application-secret.properties에서 읽습니다 (git 제외)
spring.config.import=optional:classpath:application-secret.properties
server.ssl.enabled=${SSL_ENABLED:true}

spring.application.name=loaagent
server.port=8080
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# 1. 데이터베이스 접속 정보 (환경변수 적용 + 로컬 기본값 설정)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/loaagent_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA 설정
# update: 엔티티 클래스를 바탕으로 테이블을 자동으로 생성/수정
spring.jpa.hibernate.ddl-auto=update

# 콘솔에 실행되는 SQL 쿼리를 보기 좋게 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL 방언(Dialect) 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#세션 저장소를 JDBC(DB)로 지정
spring.session.store-type=jdbc

#세션용 테이블 자동으로 생성
spring.session.jdbc.initialize-schema=embedded

#세션 쿠키 이름 변경
server.servlet.session.cookie.name=LOAAGENT_SESSION

#URL에 세션 ID 노출 차단
server.servlet.session.tracking-modes=cookie

#FastAPI(AI 서버) 호출 타임아웃
#연결 제한 시간(ms): 서버가 꺼져 있거나 응답이 없을 때
fastapi.connect-timeout-ms=${FASTAPI_CONNECT_TIMEOUT_MS:3000}
#응답 대기 제한 시간(초): LLM 처리가 길어질 때. 같은 계정 질문은 앞 질문이 끝날 때까지 기다리므로(FastAPI lock) 그 대기 시간도 포함된다
#FastAPI는 늦어도 결국 답을 저장하므로, 줄 선 질문도 504 대신 답을 받도록 넉넉히 둔다 (실측값 아님)
fastapi.response-timeout-seconds=${FASTAPI_RESPONSE_TIMEOUT_SECONDS:300}
